<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Terminal Window Background -->
  <rect x="16" y="16" width="480" height="480" rx="80" fill="#0d1117" stroke="#21262d" stroke-width="8" />
  
  <!-- Window Header Bar Separator -->
  <line x1="16" y1="128" x2="496" y2="128" stroke="#21262d" stroke-width="6" />

  <!-- Window Controls -->
  <circle cx="72" cy="72" r="16" fill="#ff6b6b" />
  <circle cx="120" cy="72" r="16" fill="#f0b46a" />
  <circle cx="168" cy="72" r="16" fill="#74e08a" />

  <!-- Terminal Prompt Symbol (>_) -->
  <path d="M 96 210 L 184 272 L 96 334" fill="none" stroke="#74e08a" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="224" y1="334" x2="312" y2="334" stroke="#f3f3f7" stroke-width="32" stroke-linecap="round" />
</svg>
